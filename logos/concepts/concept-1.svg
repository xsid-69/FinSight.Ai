<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="c1-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="c1-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#c1-bg)"/>

  <g id="icon">
    <!-- Outer Focus Aperture / Lens Rings -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="#1E293B" stroke-width="12"/>
    <path d="M 136 256 A 120 120 0 0 1 376 256" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12"/>

    <!-- Dynamic Upward Financial Horizon Trajectory Curve -->
    <path d="M 120 320 C 180 320 220 260 280 200 C 330 150 360 140 395 135" fill="none" stroke="url(#c1-red)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Secondary Foresight Arc (Emerald) -->
    <path d="M 160 360 C 220 360 260 310 320 250 C 360 210 380 200 410 195" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Central AI Vision Aperture (Core Eye) -->
    <circle cx="256" cy="256" r="42" fill="url(#c1-red)"/>
    <circle cx="256" cy="256" r="22" fill="#FFFFFF"/>
    
    <!-- Foresight Diamond Spark (Top Right) -->
    <polygon points="395,115 407,135 427,147 407,159 395,179 383,159 363,147 383,135" fill="url(#c1-gold)"/>
  </g>
</svg>