<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="c2-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="c2-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#c2-bg)"/>

  <g id="icon">
    <!-- Defensive Shield Outline -->
    <path d="M 256 80 L 390 135 C 390 270 330 375 256 425 C 182 375 122 270 122 135 Z" fill="#27272A" stroke="#3F3F46" stroke-width="8"/>

    <!-- Concentric Radar Sweep Arcs (Air-Gapped Telephony Radar) -->
    <path d="M 256 160 A 80 80 0 0 1 336 240" fill="none" stroke="url(#c2-cyan)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256 120 A 120 120 0 0 1 376 240" fill="none" stroke="url(#c2-cyan)" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

    <!-- Modern Geometric 'F' Monogram in Crimson -->
    <!-- F Stem -->
    <rect x="200" y="165" width="28" height="180" rx="14" fill="url(#c2-red)"/>
    <!-- F Top Bar -->
    <rect x="200" y="165" width="125" height="28" rx="14" fill="url(#c2-red)"/>
    <!-- F Middle Bar (Growth Arrow) -->
    <path d="M 200 235 L 290 235 L 305 249 L 290 263 L 200 263 Z" fill="url(#c2-red)"/>

    <!-- Core Security Pulse Node -->
    <circle cx="214" cy="179" r="8" fill="#FFFFFF"/>
  </g>
</svg>