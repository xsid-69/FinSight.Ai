<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="c4-inflow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="c4-outflow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#c4-bg)"/>

  <g id="icon">
    <!-- Dual-Loop Interlocking Infinity Path -->
    <!-- Left Loop: Money In (Green) -->
    <path d="M 256 256 C 210 190 140 190 140 256 C 140 322 210 322 256 256" fill="none" stroke="url(#c4-inflow)" stroke-width="36" stroke-linecap="round"/>

    <!-- Right Loop: Money Out (Red) -->
    <path d="M 256 256 C 302 322 372 322 372 256 C 372 190 302 190 256 256" fill="none" stroke="url(#c4-outflow)" stroke-width="36" stroke-linecap="round"/>

    <!-- Central Equilibrium Core (AI Copilot Eye) -->
    <circle cx="256" cy="256" r="32" fill="#0F172A" stroke="#FFFFFF" stroke-width="10"/>
    <circle cx="256" cy="256" r="14" fill="#FBBF24"/>

    <!-- Forward Growth Arrow Tip on upper loop -->
    <polygon points="350,170 376,190 342,204" fill="#EF4444"/>
  </g>
</svg>