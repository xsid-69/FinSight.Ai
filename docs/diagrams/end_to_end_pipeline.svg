    <rect x="30" y="102" width="220" height="18" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="38" y="115" style="font-size: 9px; font-weight: 700; fill: #34D399;">✔ 100% AIR-GAPPED CORE COMPUTATION</text>
