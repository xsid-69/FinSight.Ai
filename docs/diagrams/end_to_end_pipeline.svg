    <text x="68" y="50" class="step-tech">papaparse • expo-document-picker • Firestore</text>
    <text x="20" y="80" class="step-desc">Instant multi-bank statement ingestion (HDFC, SBI, ICICI).</text>
    <text x="20" y="98" class="step-desc">Automatic column detection &amp; SHA-256 deduplication.</text>
