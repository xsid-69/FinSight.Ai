<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="100%" height="100%">
  <defs>
    <linearGradient id="smsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 20px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; font-size: 13px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
  </style>

  <rect width="1050" height="560" rx="16" fill="url(#smsBg)" stroke="#1E293B" stroke-width="2"/>

  <text x="50" y="45" class="title">Native SMS Interception &amp; On-Device Privacy Flow</text>
  <text x="50" y="66" class="subtitle">Sub-2ms Telephony Broadcast Intake with Zero Disk OTP Exposure</text>

  <!-- Step A: OS Telephony -->
  <g transform="translate(50, 100)">
    <rect width="180" height="120" rx="10" fill="#182030" stroke="#EF4444" stroke-width="1.5"/>
    <text x="20" y="30" class="card-title" fill="#EF4444">1. Cellular / Bank</text>
    <text x="20" y="55" class="card-text">Inbound Bank SMS</text>
    <text x="20" y="75" class="card-text">SBI, HDFC, ICICI, Axis</text>
    <text x="20" y="95" class="card-text">Telephony Broadcast</text>
  </g>

  <path d="M 230 160 L 270 160" stroke="#EF4444" stroke-width="2" marker-end="url(#arRed)"/>

  <!-- Step B: Kotlin Receiver -->
  <g transform="translate(280, 100)">
    <rect width="210" height="120" rx="10" fill="#182030" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="20" y="30" class="card-title" fill="#F59E0B">2. SmsReceiver.kt</text>
    <text x="20" y="55" class="card-text">Native High-Priority Hook</text>
    <text x="20" y="75" class="card-text">Filters Telephony Headers</text>
    <text x="20" y="95" class="card-text">Discard Spam in &lt;2ms</text>
  </g>

  <path d="M 490 160 L 530 160" stroke="#F59E0B" stroke-width="2" marker-end="url(#arRed)"/>

  <!-- Step C: Privacy Sanitizer -->
  <g transform="translate(540, 100)">
    <rect width="210" height="120" rx="10" fill="#182030" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="20" y="30" class="card-title" fill="#06B6D4">3. privacySanitizer.js</text>
    <text x="20" y="55" class="card-text">In-Memory Sandbox</text>
    <text x="20" y="75" class="card-text">Strip 4-6 Digit OTPs</text>
    <text x="20" y="95" class="card-text">Mask Account Numbers</text>
  </g>

  <path d="M 750 160 L 790 160" stroke="#06B6D4" stroke-width="2" marker-end="url(#arRed)"/>

  <!-- Step D: Tier-1 Regex Matcher -->
  <g transform="translate(800, 100)">
    <rect width="200" height="120" rx="10" fill="#182030" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="30" class="card-title" fill="#10B981">4. smsParser.js</text>
    <text x="20" y="55" class="card-text">Extract Amount (₹)</text>
    <text x="20" y="75" class="card-text">Debit / Credit Flag</text>
    <text x="20" y="95" class="card-text">Merchant VPA String</text>
  </g>

  <!-- Downward split -->
  <path d="M 900 220 L 900 270 L 650 270 L 650 310" stroke="#10B981" stroke-width="2" marker-end="url(#arGreen)"/>

  <!-- Tier 2 & 3 Decision Box -->
  <g transform="translate(500, 320)">
    <rect width="300" height="100" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="20" y="30" class="card-title">Merchant Brand Resolution</text>
    <text x="20" y="55" class="card-text">Known VPA: Local Brand Registry (Tier-2)</text>
    <text x="20" y="75" class="card-text">Unknown VPA: OpenAI GPT-4o-mini + Cache (Tier-3)</text>
  </g>

  <path d="M 500 370 L 370 370" stroke="#10B981" stroke-width="2" marker-end="url(#arGreen)"/>

  <!-- Local Cache & Firestore Sync -->
  <g transform="translate(60, 320)">
    <rect width="300" height="100" rx="10" fill="#11291E" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="30" class="card-title" fill="#34D399">Persistence &amp; Instant UI Render</text>
    <text x="20" y="55" class="card-text">1. Optimistic write to AsyncStorage (Local)</text>
    <text x="20" y="75" class="card-text">2. Sync to /users/UID/transactions (Firestore)</text>
  </g>

  <!-- Final Output Banner -->
  <g transform="translate(50, 450)">
    <rect width="950" height="70" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="30" y="30" style="font-family: sans-serif; font-weight: 700; fill: #C7D2FE; font-size: 13px;">⚡ LIVE TELEMETRY DELIVERED TO SETTLEMENT STREAM IN &lt; 2 MILLISECONDS</text>
    <text x="30" y="50" style="font-family: sans-serif; fill: #A5B4FC; font-size: 11px;">Haptic vibration triggered • Overview Net Balance immediately recalculated • Zero PII exposed.</text>
  </g>
</svg>